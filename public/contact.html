<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS - Contact System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="contact.css">
    
</head>
<body>

    <nav>
    <div class="logo">
        <img src="last.png" alt="Logo" class="logo-img">
        <span>HTS</span>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="consultant.html">Consultant</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="auth-buttons">
        <button class="btn btn-login">Log In</button>
        <button class="btn btn-signup">Sign Up</button>
    </div>
</nav>

    <div class="app-container">
        <aside class="sidebar-contacts">
            <div class="sidebar-header">
                <h2>Contacts</h2>
                <input type="text" class="search-input" placeholder="Search friend...">
            </div>

            <div class="contact-list">
                <div class="friend-label">Online — 14</div>
                
                <div class="user-row" onclick="openChat('???')">
                    <div class="avatar-container">
                        <img src="https://ui-avatars.com/api/?name=User&background=f0f0f0" alt="avatar">
                        <span class="status-dot online"></span>
                    </div>
                    <div class="user-details">
                        <div class="user-name">???</div>
                        <div class="user-info">League of Legends</div>
                    </div>
                </div>

                <div class="user-row" onclick="openChat('c4sure')">
                    <div class="avatar-container">
                        <img src="https://ui-avatars.com/api/?name=C4&background=f0f0f0" alt="avatar">
                        <span class="status-dot online"></span>
                    </div>
                    <div class="user-details">
                        <div class="user-name">c4sure</div>
                        <div class="user-info">Online</div>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
            </div>
        </aside>

        <main class="chat-main">
            <div class="chat-header">
                <h3 id="chat-title">Select a contact</h3>
            </div>
            <div class="chat-body" id="chat-display">
                <div class="empty-state">
                    <h1>HTS Messenger</h1>
                    <p>Select a friend to start contact</p>
                </div>
            </div>
            <div class="chat-footer">
                <input type="text" id="msg-input" placeholder="Type message...">
                <button id="send-btn">Send</button>
            </div>
        </main>
    </div>

    <script src="contact.js"></script>
</body>
</html>
