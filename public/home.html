<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoNow | Master Languages</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    
    <link rel="stylesheet" href="style.css">
</head>
    <script>
    const authArea = document.getElementById("authArea");
    const userEmail = localStorage.getItem("userEmail");

    // 🔐 Protect page
    if (!userEmail) {
        window.location.href = "/login.html";
    }

    if (userEmail) {
        authArea.innerHTML = `
            <span style="margin-right:15px">${userEmail}</span>
            <button class="btn btn-login" onclick="logout()">Logout</button>
        `;
    } else {
        authArea.innerHTML = `
            <button class="btn btn-login" onclick="location.href='auth/login.html'">Log In</button>
            <button class="btn btn-signup" onclick="location.href='auth/register.html'">Sign Up</button>
        `;
    }

    function logout() {
        localStorage.removeItem("userEmail");
        window.location.href = "/login.html";
    }
</script>
<body>

    <nav>
        <div class="logo">
        <img src="last.png" alt="Logo" class="logo-img">
        <span>HTS</span>
    </div>

        <ul class="nav-links">
            <!-- all of this must go to home.html -->
            <li><a href="login.html">Home</a></li>
            <li><a href="login.html">Community</a></li>
            <li><a href="login.html">Consultant</a></li>
            <li><a href="login.html">Contact</a></li>
        </ul>
        <div class="auth-buttons">
            <button class="btn btn-login"><a href="login.html">Log In</a></button>
            <button class="btn btn-signup"><a href="register.html">Sign Up</a></button>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Let's be Study Partners! <br><span>I’m looking for someone to trade knowledge with, not heartbeats.</span></h1>
            <p>Choose from over 5000 people and offline teachers. and make a great points</p>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Lets Study Togther!">
                <button onclick="filterTeachers()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            
            <div style="margin-top: 20px; font-size: 14px; color: #777;">
                <i class="fa-solid fa-check-circle" style="color: var(--accent);"></i> Verified Teachers &nbsp;
                <i class="fa-solid fa-check-circle" style="color: var(--accent);"></i> Fight and Fun toghter
            </div>
        </div>
        <div class="hero-image">
            <img src="maskot.png" alt="Students learning">
        </div>
    </section>

    <script src="../script.js"></script>
</body>
</html>
